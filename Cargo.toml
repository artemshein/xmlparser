[package]
name = "xmlparser"
version = "0.13.6"
authors = ["Yevhenii Reizner <razrfalcon@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Pull-based, zero-allocation XML parser."
documentation = "https://docs.rs/xmlparser"
readme = "README.md"
homepage = "https://github.com/RazrFalcon/xmlparser"
repository = "https://github.com/RazrFalcon/xmlparser"
license = "MIT OR Apache-2.0"
keywords = ["parser", "tokenizer", "xml"]
categories = ["parser-implementations"]

[features]
default = ["std"]
std = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
xmlparser-upstream = { version = "0.13", package = "xmlparser" }

[[bench]]
name = "tokenize"
harness = false
