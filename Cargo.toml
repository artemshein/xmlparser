[package]
name = "xmltok"
version = "0.14.0"
authors = ["Yevhenii Reizner <razrfalcon@gmail.com>", "Artem Shein <artem.shein.de@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Pull-based, zero-allocation XML tokenizer with compact, lifetime-free tokens. A fork of xmlparser."
documentation = "https://docs.rs/xmltok"
readme = "README.md"
homepage = "https://github.com/artemshein/xmlparser"
repository = "https://github.com/artemshein/xmlparser"
license = "MIT OR Apache-2.0"
keywords = ["parser", "tokenizer", "xml"]
categories = ["parser-implementations"]

[features]
default = ["std"]
std = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
xmlparser-upstream = { version = "0.13", package = "xmlparser" }

[[bench]]
name = "tokenize"
harness = false
